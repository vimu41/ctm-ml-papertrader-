name: Deriv synthetic history (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: deriv-history
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websocket-client
      - run: python deriv/fetch_history.py
      - run: |
          git config user.name "ctm-bot"
          git config user.email "ctm-bot@users.noreply.github.com"
          git add deriv/history
          git diff --cached --quiet || git commit -m "deriv synthetic H1 history"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
