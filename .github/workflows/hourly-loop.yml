name: Hourly loop (reliable runner)
# GitHub's own cron often skips hours. This job starts every 5 hours and itself runs all
# all bots once an hour for ~5h40m, then starts its own successor (public repo: Actions minutes are free).
on:
  schedule:
    - cron: '3 */5 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: hourly-loop
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websocket-client==1.8.0 -r crypto/requirements.txt
      - name: Run the bots every hour
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ctm-bot"
          git config user.email "ctm-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 340*60 ))
          while [ $(date +%s) -lt $end ]; do
            git pull -q --rebase || git rebase --abort || true
            dow=$(date -u +%u)                       # 6 = Saturday: forex closed
            if [ "$dow" != "6" ]; then python bot.py || true; python fx_v2/bot.py || true; CTM_MIN_PIPS=50 CTM_DATA=fx_v3_50/data python bot.py || true; fi
            python crypto/bot.py || true
            python deriv/bot.py || true                # Deriv CV 01: volatility indices trade 24/7
            mkdir -p fx_v3_50/data
            git add -A data SUMMARY.md fx_v2/data fx_v2/SUMMARY.md crypto/data crypto/SUMMARY.md || true
            git add -A fx_v3_50 deriv/data deriv/SUMMARY.md 2>/dev/null || true
            git diff --cached --quiet || git commit -q -m "hourly loop update $(date -u +'%Y-%m-%d %H:%M')"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
            gh workflow run dashboard.yml --ref main || true    # refresh the dashboard page
            # sleep until 7 minutes past the next hour
            now=$(date +%s); next=$(( (now/3600 + 1)*3600 + 420 ))
            [ $next -lt $end ] || break
            sleep $(( next - now ))
          done
          # hand over to a fresh run so the loop never depends on GitHub's cron
          gh workflow run hourly-loop.yml --ref main
