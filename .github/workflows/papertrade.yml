name: CTM ML paper trade
on:
  schedule:
    - cron: '23,53 * * * 1-5'   # twice an hour Mon-Fri (UTC); off-peak minutes, duplicate runs are harmless
    - cron: '23,53 21-23 * * 0' # Sunday evening market open
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: papertrade
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websocket-client==1.8.0
      - run: python bot.py
      - name: Save journal
        run: |
          git config user.name "ctm-bot"
          git config user.email "ctm-bot@users.noreply.github.com"
          git add -A data SUMMARY.md
          git diff --cached --quiet || git commit -m "paper trade update $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase && git push
