name: Crypto history download
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: papertrade
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python crypto/fetch_history.py
      - name: Save history
        run: |
          git config user.name "ctm-bot"
          git config user.email "ctm-bot@users.noreply.github.com"
          git add crypto/history
          git diff --cached --quiet || git commit -m "crypto 1h history $(date -u +'%Y-%m-%d')"
          git pull --rebase && git push
