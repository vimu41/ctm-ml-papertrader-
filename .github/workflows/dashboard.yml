name: Dashboard
on:
  schedule:
    - cron: '55 * * * *'       # hourly, after both bots have had their turn
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: papertrade
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python dashboard/build.py
      - name: Save dashboard data
        run: |
          git config user.name "ctm-bot"
          git config user.email "ctm-bot@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "dashboard data $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase && git push
      - name: Economic calendar (high-impact news, this week + next week; info for the desk only)
        run: |
          for w in thisweek nextweek; do
            curl -fsSL --retry 2 -A "Mozilla/5.0" https://nfs.faireconomy.media/ff_calendar_$w.json -o /tmp/$w.json || echo '[]' > /tmp/$w.json
          done
          python - <<'PY'
          import json
          out, seen = [], set()
          for w in ('thisweek', 'nextweek'):
              try: d = json.load(open(f'/tmp/{w}.json'))
              except Exception: d = []
              for e in d if isinstance(d, list) else []:
                  k = (e.get('date'), e.get('country'), e.get('title'))
                  if k not in seen: seen.add(k); out.append(e)
          json.dump(out, open('site/news.json', 'w'))
          print(len(out), 'events,', sum(e.get('impact') == 'High' for e in out), 'high impact')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - id: deploy
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
