name: Deriv OOS history (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: deriv-oos
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sym: [1HZ15V, 1HZ30V, 1HZ90V, 1HZ150V, 1HZ250V, JD10, JD25, JD50, JD75, JD100, stpRNG]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websocket-client
      - run: python deriv/fetch_history.py ${{ matrix.sym }}
      - uses: actions/upload-artifact@v4
        with:
          name: hist-${{ matrix.sym }}
          path: deriv/history/${{ matrix.sym }}_H1.csv.gz
  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/h
      - run: |
          mkdir -p deriv/history && cp /tmp/h/*/*.csv.gz deriv/history/ && ls -la deriv/history
          git config user.name "ctm-bot"
          git config user.email "ctm-bot@users.noreply.github.com"
          git add deriv/history
          git diff --cached --quiet || git commit -m "deriv OOS H1 history"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
