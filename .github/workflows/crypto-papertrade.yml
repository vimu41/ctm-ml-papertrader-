name: CTM crypto paper trade
on:
  schedule:
    - cron: '41 * * * *'       # every hour, every day (crypto trades 24/7); catch-up covers skipped runs
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: papertrade
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: crypto/requirements.txt
      - run: pip install -r crypto/requirements.txt
      - run: python crypto/bot.py
      - name: Save journal
        run: |
          git config user.name "ctm-bot"
          git config user.email "ctm-bot@users.noreply.github.com"
          git add -A crypto/data crypto/SUMMARY.md
          git diff --cached --quiet || git commit -m "crypto paper update $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase && git push
